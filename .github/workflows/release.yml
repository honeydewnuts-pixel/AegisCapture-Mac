name: Build and Release AegisCapture-Mac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Manual build number (optional)'
        required: false
        default: ''

jobs:
  build-mac:
    name: Build macOS Application
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - List Files
        run: |
          echo "=== Repository Contents ==="
          ls -la
          echo ""
          echo "=== Swift Files ==="
          find . -name "*.swift" -type f | head -20

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build with build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Find and Copy Built App
        run: |
          # Find the built .app
          APP_PATH=$(find ./build -name "*.app" -type d -o -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find . -name "*.app" -type d | head -20
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          mkdir -p ./dist
          cp -r "$APP_PATH" ./dist/
          
          # Get app name
          APP_NAME=$(basename "$APP_PATH")
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Verify macOS App
        run: |
          if [ -d "./dist/${{ env.APP_NAME }}" ]; then
            echo "✅ macOS app bundle created successfully"
            du -sh ./dist/${{ env.APP_NAME }}
            ls -la ./dist/${{ env.APP_NAME }}/Contents/
          else
            echo "❌ macOS app bundle not found!"
            find ./dist -type d
            exit 1
          fi

      - name: Create DMG (Optional)
        if: success()
        run: |
          brew install create-dmg || true
          if command -v create-dmg &> /dev/null; then
            APP_NAME_NO_EXT=$(echo "${{ env.APP_NAME }}" | sed 's/\.app$//')
            create-dmg \
              --volname "$APP_NAME_NO_EXT" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --icon "${{ env.APP_NAME }}" 200 190 \
              --hide-extension "${{ env.APP_NAME }}" \
              --app-drop-link 600 185 \
              ./dist/$APP_NAME_NO_EXT.dmg \
              ./dist/${{ env.APP_NAME }} || echo "DMG creation failed, continuing"
          else
            echo "create-dmg not available, skipping DMG"
          fi

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AegisCapture-Mac
          path: ./dist/*.app
          retention-days: 7

      - name: Upload DMG (if created)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AegisCapture-Mac-DMG
          path: ./dist/*.dmg
          retention-days: 7
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: [build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Debug - Check Downloaded Artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find ./artifacts -type f -o -type d | head -50

      - name: Generate Version Tag
        id: version
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUM="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUM="${{ github.run_number }}"
          fi
          VERSION="v${BUILD_DATE}-$(printf "%02d" $BUILD_NUM)"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "Created version: ${VERSION}"

      - name: Prepare Release Assets
        run: |
          mkdir -p ./release-assets
          
          # Find and copy .app bundles
          find ./artifacts -name "*.app" -type d -exec cp -r {} ./release-assets/ \; 2>/dev/null || true
          
          # Find and copy .dmg files
          find ./artifacts -name "*.dmg" -exec cp {} ./release-assets/ \; 2>/dev/null || true
          
          # If nothing found, create a zip of what we have
          if [ -z "$(ls -A ./release-assets 2>/dev/null)" ]; then
            echo "No app bundles found, creating archive"
            cd ./artifacts
            zip -r ../release-assets/AegisCapture-Mac.zip ./* || true
            cd ..
          fi
          
          echo "Release assets:"
          ls -la ./release-assets/ || echo "No assets"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: AegisCapture-Mac ${{ steps.version.outputs.TAG }}
          body: |
            ## AegisCapture-Mac Release ${{ steps.version.outputs.TAG }}
            
            ### 🚀 Features
            - macOS SwiftUI app
            - Captures MT5 chart region
            - Sends to AEGIS cloud
            - BUY/SELL/HOLD signal display
            
            ### 📦 Downloads
            - **App Bundle**: `AegisCapture.app`
            - **DMG Installer**: `AegisCapture.dmg`
            
            ### 🔧 Installation
            1. Download the app bundle or DMG
            2. Move AegisCapture.app to Applications folder
            3. Open and grant required permissions
            
            ### 📝 Changelog
            - Built from latest main branch
            - Compatible with macOS 14+
          files: |
            ./release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release URL
        run: |
          echo "## ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Release Tag: ${{ steps.version.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
