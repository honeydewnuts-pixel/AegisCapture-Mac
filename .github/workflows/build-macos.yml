name: Build and Release AegisCapture-Mac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Manual build number (optional)'
        required: false
        default: ''

jobs:
  build-mac:
    name: Build macOS Application
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - List Files
        run: |
          echo "=== Repository Contents ==="
          find . -type f -name "*.swift" -o -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20
          echo ""
          echo "=== Xcode Versions Available ==="
          ls /Applications/ | grep Xcode

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Use a version that exists on the runner
          # Based on the output: 26.6.0 is available
          xcode-version: '26.6.0'  # Xcode 16.6
          # Or use 'latest' to always get the newest
          # xcode-version: 'latest'

      - name: Build macOS App
        run: |
          # Find the Xcode project or workspace
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -1)
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" -type d | head -1)
          
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "Building workspace: $WORKSPACE_FILE"
            # Build using workspace
            xcodebuild build \
              -workspace "$WORKSPACE_FILE" \
              -scheme AegisCapture \
              -configuration Release \
              -derivedDataPath ./build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          elif [ -n "$PROJECT_FILE" ]; then
            echo "Building project: $PROJECT_FILE"
            # Build using project
            xcodebuild build \
              -project "$PROJECT_FILE" \
              -scheme AegisCapture \
              -configuration Release \
              -derivedDataPath ./build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "❌ No Xcode project or workspace found!"
            echo "Files in current directory:"
            ls -la
            exit 1
          fi

      - name: Find and Copy Built App
        run: |
          # Find the built .app
          APP_PATH=$(find ./build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ./build -type d | head -20
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          mkdir -p ./dist
          cp -r "$APP_PATH" ./dist/
          
          # Get app name
          APP_NAME=$(basename "$APP_PATH")
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Verify macOS App
        run: |
          if [ -d "./dist/${{ env.APP_NAME }}" ]; then
            echo "✅ macOS app bundle created successfully"
            du -sh ./dist/${{ env.APP_NAME }}
            echo "Contents:"
            ls -la ./dist/${{ env.APP_NAME }}/Contents/MacOS/ 2>/dev/null || echo "No MacOS folder found"
            # Check if it's a valid bundle
            if [ -f "./dist/${{ env.APP_NAME }}/Contents/Info.plist" ]; then
              echo "✅ Info.plist found"
              cat ./dist/${{ env.APP_NAME }}/Contents/Info.plist | head -20
            else
              echo "⚠️ Info.plist not found"
            fi
          else
            echo "❌ macOS app bundle not found!"
            find ./dist -type d
            exit 1
          fi

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AegisCapture-Mac
          path: ./dist/*.app
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Debug - Check Downloaded Artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find ./artifacts -type f -o -type d | head -50

      - name: Generate Version Tag
        id: version
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUM="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUM="${{ github.run_number }}"
          fi
          VERSION="v${BUILD_DATE}-$(printf "%02d" $BUILD_NUM)"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "Created version: ${VERSION}"

      - name: Prepare Release Assets
        run: |
          mkdir -p ./release-assets
          
          # Find and copy .app bundles
          find ./artifacts -name "*.app" -type d -exec cp -r {} ./release-assets/ \;
          
          # List what we have
          echo "Release assets:"
          ls -la ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: AegisCapture-Mac ${{ steps.version.outputs.TAG }}
          body: |
            ## AegisCapture-Mac Release ${{ steps.version.outputs.TAG }}
            
            ### 🚀 Features
            - macOS SwiftUI app
            - Captures MT5 chart region
            - Sends to AEGIS cloud
            
            ### 📦 Downloads
            - **App Bundle**: Download the `.app` folder as a zip
            
            ### 🔧 Installation
            1. Download the app bundle
            2. Move to Applications folder
            3. Open and allow permissions
            
            ### 📝 Changelog
            - Built from latest main branch
            - Compatible with macOS 14+
          files: |
            ./release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release URL
        run: |
          echo "## ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Release Tag: ${{ steps.version.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
