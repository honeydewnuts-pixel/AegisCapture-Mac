name: Build macOS Artifacts (V46)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Stage dist
        run: |
          mkdir -p dist
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find . -maxdepth 5 -type d | head -50
            exit 1
          fi
          echo "Found $APP_PATH"
          cp -R "$APP_PATH" dist/
          APP_NAME=$(basename "$APP_PATH")
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME" "dist/AegisCapture-Mac.app.zip"

      - name: Create DMG
        run: |
          brew install create-dmg || true
          if command -v create-dmg >/dev/null 2>&1; then
            create-dmg \
              --volname "AEGIS Capture V46" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --app-drop-link 600 185 \
              "dist/AEGIS_Capture.dmg" \
              "dist/${APP_NAME}" || true
          fi
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisCapture-Mac-V46
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
