name: Build and Release AegisCapture-Mac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Manual build number (optional)'
        required: false
        default: ''

jobs:
  build-mac:
    name: Build macOS Application
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - List Files
        run: |
          echo "=== Repository Contents ==="
          ls -la
          echo ""
          echo "=== Swift Files ==="
          find . -name "*.swift" -type f | head -20

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Check for Package.swift
        id: check-package
        run: |
          if [ -f "Package.swift" ]; then
            echo "Found Package.swift - using Swift Package Manager"
            echo "USE_SPM=true" >> $GITHUB_ENV
          else
            echo "No Package.swift found"
            echo "USE_SPM=false" >> $GITHUB_ENV
          fi

      - name: Build with Swift Package Manager
        if: env.USE_SPM == 'true'
        run: |
          swift build -c release --arch arm64 --arch x86_64
          # Find the built executable
          BUILD_PATH=$(find .build -name "AegisCapture" -type f | head -1)
          if [ -n "$BUILD_PATH" ]; then
            echo "✅ Build successful: $BUILD_PATH"
            mkdir -p ./dist
            cp -r "$BUILD_PATH" ./dist/
          else
            echo "❌ Could not find built executable"
            find .build -type f
            exit 1
          fi

      - name: Create App Bundle
        if: env.USE_SPM == 'true'
        run: |
          mkdir -p ./dist/AegisCapture.app/Contents/MacOS
          mkdir -p ./dist/AegisCapture.app/Contents/Resources
          
          # Copy executable
          if [ -f "./dist/AegisCapture" ]; then
            cp ./dist/AegisCapture ./dist/AegisCapture.app/Contents/MacOS/
          else
            # Try to find the executable
            EXEC_PATH=$(find .build -name "AegisCapture" -type f | head -1)
            if [ -n "$EXEC_PATH" ]; then
              cp "$EXEC_PATH" ./dist/AegisCapture.app/Contents/MacOS/
            else
              echo "❌ Could not find executable"
              exit 1
            fi
          fi
          
          # Copy Info.plist if exists
          if [ -f "Info.plist" ]; then
            cp Info.plist ./dist/AegisCapture.app/Contents/
          else
            # Create a default Info.plist
            cat > ./dist/AegisCapture.app/Contents/Info.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>AegisCapture</string>
    <key>CFBundleIdentifier</key>
    <string>com.aegiscapture.mac</string>
    <key>CFBundleName</key>
    <string>AegisCapture</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0.0</string>
    <key>CFBundleVersion</key>
    <string>1.0.0</string>
    <key>LSMinimumSystemVersion</key>
    <string>14.0</string>
    <key>NSAppleEventsUsageDescription</key>
    <string>AegisCapture needs to control MetaTrader 5</string>
    <key>NSScreenCaptureUsageDescription</key>
    <string>AegisCapture needs to capture the MT5 chart region</string>
</dict>
</plist>
EOF
          fi
          
          # Copy resources
          if [ -d "Resources" ]; then
            cp -r Resources/* ./dist/AegisCapture.app/Contents/Resources/ 2>/dev/null || true
          fi
          
          # Make executable
          chmod +x ./dist/AegisCapture.app/Contents/MacOS/AegisCapture

      - name: Verify App Bundle
        run: |
          if [ -d "./dist/AegisCapture.app" ]; then
            echo "✅ App bundle created successfully"
            du -sh ./dist/AegisCapture.app
            echo "Contents:"
            ls -la ./dist/AegisCapture.app/Contents/
            if [ -f "./dist/AegisCapture.app/Contents/MacOS/AegisCapture" ]; then
              echo "✅ Executable found"
              file ./dist/AegisCapture.app/Contents/MacOS/AegisCapture
            else
              echo "⚠️ No executable found in app bundle"
              find ./dist/AegisCapture.app -type f
            fi
          else
            echo "❌ App bundle not created"
            find ./dist -type f
            exit 1
          fi

      - name: Create DMG (Optional)
        if: success()
        run: |
          brew install create-dmg || true
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "AegisCapture" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --icon "AegisCapture.app" 200 190 \
              --hide-extension "AegisCapture.app" \
              --app-drop-link 600 185 \
              ./dist/AegisCapture.dmg \
              ./dist/AegisCapture.app || echo "DMG creation failed, continuing"
          else
            echo "create-dmg not available, skipping DMG"
          fi

      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AegisCapture-Mac
          path: ./dist/AegisCapture.app
          retention-days: 7

      - name: Upload DMG (if created)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AegisCapture-Mac-DMG
          path: ./dist/*.dmg
          retention-days: 7
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: [build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Debug - Check Downloaded Artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find ./artifacts -type f -o -type d | head -50

      - name: Generate Version Tag
        id: version
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUM="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUM="${{ github.run_number }}"
          fi
          VERSION="v${BUILD_DATE}-$(printf "%02d" $BUILD_NUM)"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${VERSION}" >> $GITHUB_OUTPUT
          echo "Created version: ${VERSION}"

      - name: Prepare Release Assets
        run: |
          mkdir -p ./release-assets
          
          # Find and copy .app bundles
          find ./artifacts -name "*.app" -type d -exec cp -r {} ./release-assets/ \;
          
          # Find and copy .dmg files
          find ./artifacts -name "*.dmg" -exec cp {} ./release-assets/ \;
          
          # If nothing found, create a zip of what we have
          if [ -z "$(ls -A ./release-assets)" ]; then
            echo "No app bundles found, creating archive"
            cd ./artifacts
            zip -r ../release-assets/AegisCapture-Mac.zip ./*
            cd ..
          fi
          
          echo "Release assets:"
          ls -la ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: AegisCapture-Mac ${{ steps.version.outputs.TAG }}
          body: |
            ## AegisCapture-Mac Release ${{ steps.version.outputs.TAG }}
            
            ### 🚀 Features
            - macOS SwiftUI app
            - Captures MT5 chart region
            - Sends to AEGIS cloud
            - BUY/SELL/HOLD signal display
            
            ### 📦 Downloads
            - **App Bundle**: `AegisCapture.app` (drag to Applications)
            - **DMG Installer**: `AegisCapture.dmg` (easier installation)
            
            ### 🔧 Installation
            1. Open the DMG or download the app bundle
            2. Move AegisCapture.app to Applications folder
            3. Open and grant required permissions
            
            ### 📝 Changelog
            - Built from latest main branch
            - Compatible with macOS 14+
            - SwiftUI native interface
          files: |
            ./release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release URL
        run: |
          echo "## ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Release Tag: ${{ steps.version.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
